# Full stack: PostgreSQL, Keycloak, backend API, frontend (nginx).
#   docker compose up -d --build              -> everything, app on http://localhost:5173
#   docker compose up -d postgres keycloak    -> infrastructure only, for running the backend / Vite locally
name: bidanddrive

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # dev mode: embedded storage, realm (re)imported from ./docker/keycloak when it does not exist yet
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # fixed public URL so the token issuer is always http://localhost:8180/realms/bidanddrive
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auction
      DB_USERNAME: auction
      DB_PASSWORD: auction
      # tokens are issued to the browser via localhost, so that is the issuer to validate ...
      OAUTH2_ISSUER_URI: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/bidanddrive"
      # ... but the signing keys are fetched over the compose network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bidanddrive/protocol/openid-connect/certs
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: "http://localhost:${KEYCLOAK_PORT:-8180}"
    depends_on:
      - backend
    ports:
      # the Keycloak client only allows redirects to http://localhost:5173
      - "5173:80"

volumes:
  postgres-data:
