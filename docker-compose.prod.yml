# Production stack. Secrets and environment-specific values come from environment variables
# (see .env.prod.example); required ones make compose fail fast when missing.
#
#   cp .env.prod.example .env.prod   # fill in the values, never commit it
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# TLS is expected to be terminated by a reverse proxy in front of:
#   - the app (frontend, FRONTEND_PORT)  -> APP_PUBLIC_URL       e.g. https://bidanddrive.example.com
#   - Keycloak (KEYCLOAK_PORT)           -> KEYCLOAK_PUBLIC_URL  e.g. https://auth.example.com
# The proxy must forward the Host header and set X-Forwarded-Proto / X-Forwarded-For.
name: bidanddrive-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auction}
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # not published: only reachable by the backend on the compose network

  keycloak-db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8.1
    # production mode; the realm is imported once (no test users, see docker/keycloak-prod)
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}
      # TLS ends at the reverse proxy
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # temporary admin, only used to bootstrap the master realm: change it in the admin console afterwards
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      # resolved in the realm file at import time
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL}
    volumes:
      - ./docker/keycloak-prod:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"

  backend:
    <<: *restart
    image: ${BACKEND_IMAGE:-bidanddrive-backend}:${IMAGE_TAG:-latest}
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auction}
      DB_USERNAME: ${POSTGRES_USER:-auction}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # tokens carry the public Keycloak URL as issuer; keys are fetched over the compose network
      OAUTH2_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}/realms/bidanddrive
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-auction-api}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bidanddrive/protocol/openid-connect/certs
      # HAL links use the scheme/host the browser used (https behind the proxy)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRINGDOC_API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${API_DOCS_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:-}
    # not published: the frontend's nginx is the only entry point to the API

  frontend:
    <<: *restart
    image: ${FRONTEND_IMAGE:-bidanddrive-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres-data:
  keycloak-data:
