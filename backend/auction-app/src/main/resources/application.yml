spring:
  application:
    name: auction
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auction}
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from docker-compose; the token's iss must match exactly
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/bidanddrive}
          audiences: ${OAUTH2_AUDIENCE:auction-api}
springdoc:
  # document only the responses declared on each operation, not every @ExceptionHandler on every endpoint
  override-with-generic-response: false
